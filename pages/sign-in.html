<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-in Page</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <!-- this for icon-->
  </head>
  <body>
    <div class="container">
      <div class="form-box login">
        <form id="signinForm" action="">
          <h1>Sign-in Form</h1>
          <div class="input-box">
            <input type="text" name="usernameText" id="usernameText" required placeholder="Username"/>
            <i class="bx bx-user"></i>
          </div>
          <div class="input-box">
            <input type="password" name="passwordText" id="passwordText" required placeholder="Password"/>
            <input type="checkbox" onclick="myFunction()" class="toggle-password"/>
            <i class="bx bx-lock"></i>
          </div>
          <div>
            <input class="btn" type="submit" value="Sign in" />
          </div>
          <div id="signin-msg" style="color: red; font-size: 13px; margin-top: 8px; min-height: 18px;"></div>
          <div class="link">
            <a href="/">Click me to go to sign-up page</a>
          </div>
        </form>
      </div>
      <div class="img-box">
        <img src="img/images.jpg" />
      </div>
    </div>

    <script>
      /*
        Uhhhhhhhhhhhhhhhhhhhh. html says GET /users then server responds with userDB.json content
        then we save it as idk. JSON.stringify(response.body). 
        then for obj in that, if inputUsername === obj.usernameText, check if password same.
        if all true, redirect to directory for that user
        if either false, give warning alert() boleh lah.
        */

      const form = document.getElementById("signinForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const msgDiv = document.getElementById("signin-msg");
        if (msgDiv) msgDiv.textContent = "";

        try {
          const usernameInput = document.getElementById("usernameText").value.trim();
          const passwordInput = document.getElementById("passwordText").value;

          // the server decrypts the stored password and compares it
          const response = await fetch("/sign-in", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ usernameText: usernameInput, passwordText: passwordInput })
          });
          const result = await response.json();

          if (response.ok) {
            sessionStorage.setItem("activeUser", usernameInput);
            window.location.href = "/document-upload";
          } else if (msgDiv) {
            msgDiv.textContent = result.error || "sign in failed";
          }
        } catch (error) {
          console.log(error);
          const msgDiv2 = document.getElementById("signin-msg");
          if (msgDiv2) msgDiv2.textContent = "sign in failed";
        }
      });

      function myFunction() {
        var x = document.getElementById("passwordText");
        if (x.type === "password") {
          x.type = "text";
        } else {
          x.type = "password";
        }
      }
    </script>
  </body>
</html>
