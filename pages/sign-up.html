<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Page</title>
    <link rel="stylesheet" href="style.css" />
    <!-- this for icon-->
  </head>
  <body>
    <div class="container">
      <div class="form-box login">
        <form>
          <h1>Sign-Up</h1>
          <div class="input-box">
            <!-- <label for="username">Username :</label> <br /> -->
            <input
              id="userText"
              type="text"
              name="usernameText"
              required
              placeholder="Username"
            /> <!-- why pretier do this -->
          </div>
          <div class="input-box">
            <!-- <label for="password">Password :</label> <br /> -->
            <input
              id="pass1"
              type="password"
              name="passwordText"
              required
              placeholder="Password"
            />
          <input type="checkbox" onclick="myFunction()" class="toggle-password2" />
          </div>
          <div class="input-box">
            <!-- <label for="confirmPassword">Confirm password :</label> <br /> -->
            <input
              id="pass2"
              type="password"
              name="confirmPasswordText"
              required
              placeholder="Confirm password"
            />
            <input type="checkbox" onclick="myFunction()" class="toggle-password2" />
          </div>
          <div>
            <input type="submit" value="Sign Up" class="btn" />
          </div>
          <div id="signup-msg" style="color: red; font-size: 13px; margin-top: 8px;"></div>
          <div class="link">
            <br /><a href="/sign-in">If you already signed up, CLICK ME!</a>
            <!-- <br /><a href="/test">Want to check if Python works here? CLICK ME!</a> -->
          </div>
        </form>
      </div>
      <div class="img-box">
        <img src="img/images.jpg" />
      </div>
    </div>

   <script>
        /* 
        I have a big problem. 
        Storing the user data in JSON format into a JSON file
        requires a function available to NodeJS but not browser JS.
        As such, let's propose the idea : broswer store JSON data in localStorage,
        a javascript gets the user data from localStorage and puts it into the userDB.json.
        localStorage is not a thing in Node.js
        You cannot import. So, I guess we're just doing this the HTTP Req/Res way, huh.
        */
        const form = document.querySelector("form");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById("signup-msg");
            msgDiv.textContent = "";
            
            const userText = document.getElementById("userText").value.trim();
            const passText = document.getElementById("pass1").value;
            const confPassText = document.getElementById("pass2").value;

            if (passText !== confPassText) {
                msgDiv.textContent = "Values in 'Password' and 'Confirm password' do not match.";
                return;
            }

            try {
                const response = await fetch("/users", {
                    method: "GET"
                });
                const result = await response.json();
                
                if (result.users) {
                    for(let i = 0 ; i < result.users.length ; i++){
                        if(result.users[i].usernameText === userText){
                            msgDiv.textContent = "Username already exists!";
                            return;
                        }
                    }
                }
            } catch (error) {
                console.log(error);
            }

            const userData = new FormData(form);
            try {
                const response = await fetch("/sign-up", {
                    method: "POST",
                    body: new URLSearchParams(userData)
                });
                if (response.ok) {
                    sessionStorage.setItem("activeUser", userText);
                    window.location.replace("/document-upload");
                } else {
                    const res = await response.json();
                    msgDiv.textContent = res.error || "Sign up failed";
                }
            } catch (error) {
                console.error(error);
            }
        })

        
      function myFunction() {
        var x = document.getElementById("pass1");
        var y = document.getElementById("pass2");
        if (x.type === "password") {
          x.type = "text";
          y.type = "text";
        } else {
          x.type = "password";
          y.type = "password";
        }
      }
    </script>

</body>
</html>
