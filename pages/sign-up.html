<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Page</title>
</head>
<body>
    <h1>Sign-up Form</h1>
    <form>
        <div>
            <label for="username">Username :</label> <br>
            <input type="text" name="usernameText" required>
        </div>
        <div>
            <label for="password">Password :</label> <br>
            <input id="pass1" type="text" name="passwordText" required>
        </div>
        <div>
            <label for="confirmPassword">Confirm password :</label> <br>
            <input id="pass2" type="text" name="confirmPasswordText" required>
        </div>
        <div>
            <input type="submit" value="Sign in">
        </div>
    </form>
    <div>
        <br><a href="/sign-in">Click me to go to sign-in page</a>
        <br><a href="/test">Click me to test out the python code</a>
    </div>

    <script>
        /* 
        I have a big problem. 
        Storing the user data in JSON format into a JSON file
        requires a function available to NodeJS but not browser JS.
        As such, let's propose the idea : broswer store JSON data in localStorage,
        a javascript gets the user data from localStorage and puts it into the userDB.json.
        localStorage is not a thing in Node.js
        You cannot import. So, I guess we're just doing this the HTTP Req/Res way, huh.
        */
        const form = document.querySelector("form");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const passText = await document.getElementById("pass1").value;
            const confPassText = await document.getElementById("pass2").value;

            console.log(passText, confPassText);
            if(passText != confPassText){
                alert("Values in 'Password' and 'Confirm password' do not match.");
                return;
            }

            const userData = new FormData(form);
            try {
                const response = await fetch("/sign-up", {
                    method: "POST",
                    body: new URLSearchParams(userData)
                });
                const result = await response.text();
                console.log(result);
            } catch (error) {
                console.error(error);
            }
        })
    </script>

</body>
</html>
