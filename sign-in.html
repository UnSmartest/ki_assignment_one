<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in Page</title>
</head>
<body>
    <h1>Sign-in Form</h1>
    
    <form>
        <div>
            <label for="username">Username :</label> <br>
            <input type="text" name="usernameText" required>
        </div>
        <div>
            <label for="password">Password :</label> <br>
            <input type="text" name="passwordText" required>
        </div>
        <div>
            <input type="submit" value="Sign in">
        </div>
    </form>

    <br><p id="message"></p>

    <br><a href="./test.html">Click me to test out the python code</a>

    <script>
        /* 
        I have a big problem. 
        Storing the user data in JSON format into a JSON file
        requires a function available to NodeJS but not browser JS.
        As such, let's propose the idea : broswer store JSON data in localStorage,
        a javascript gets the user data from localStorage and puts it into the userDB.json.
        localStorage is not a thing in Node.js
        You cannot import. So, I guess we're just doing this the HTTP Req/Res way, huh.
        */
        const form = document.querySelector("form");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const userData = new FormData(form);
            try {
                const response = await fetch("/sign-in", {
                    method: "POST",
                    body: new URLSearchParams(userData)
                });
                const result = await response.text();
            } catch (error) {
                console.error(error);
            }

            /*
            Data in localStorage is saved across browser sessions,
            which I assume means refreshing/closing the tab does not remove it.
            If we want the data to be reset, then we use sessionStorage.

            Attributes of localStorage
                .setItem(key, value) writes a key-value into the storage
                .getItem(key) returns the value assigned to that key
                .removeItem(key) removes the key-value from the storage
                .clear() removes all keys and values from the storage
            */
        })
    </script>

</body>
</html>
